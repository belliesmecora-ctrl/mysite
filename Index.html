<!DOCTYPE html>
<html>
<head>
<title>Login Page</title>
<style>
body {
  font-family: Arial;
  background: #f0f0f0;
  text-align: center;
}
.login-box {
  background: white;
  padding: 20px;
  margin-top: 100px;
  display: inline-block;
  border-radius: 10px;
}
input {
  padding: 10px;
  margin: 10px;
  width: 200px;
}
button {
  padding: 10px 20px;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>Login</h2>
  <input type="text" placeholder="Username"><br>
  <input type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<script>
function login() {
  alert("Login button clicked!");
}
</script>

</body>
</html>
